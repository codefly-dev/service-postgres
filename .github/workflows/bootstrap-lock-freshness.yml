# Pinning the bootstrap image's migrate build stops it drifting, which also stops it
# receiving upstream fixes. A Go builder digest upstream has moved past, and a newer
# migrate release, never fail anything — so this reports them on a schedule instead
# of gating pull requests on unrelated upstream releases.
name: bootstrap-lock-freshness

on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  freshness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Check bootstrap image lock against upstream
        run: .github/scripts/update-bootstrap-lock.sh --check
