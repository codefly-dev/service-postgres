name: controlplane

on:
  # No `paths:` filter on pull requests: main requires `restricted-postgres16`
  # by name, and a path-filtered workflow never reports on a pull request that
  # touches none of those paths, so such a pull request could never merge
  # (#212, a Dockerfile-only change, sat BLOCKED on a check that never ran).
  # The job takes about two minutes and runs beside `image`, so it costs no
  # wall-clock time.
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - "libs/go/**"
      - "cmd/managed-bootstrap/**"
      - "go.mod"
      - "go.sum"
      - "scripts/qualify-controlplane.py"
      - ".github/workflows/controlplane.yml"

permissions:
  contents: read

jobs:
  restricted-postgres16:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      POSTGRES_TEST_IMAGE: postgres@sha256:fe03a7605299a34ddf5e4f285dff78c3d7190a576b3c6b46f2fcff69f4bffd54
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: false
      - run: go vet ./...
        working-directory: libs/go
        env:
          GOWORK: "off"
          GOENV: "off"
          GOFLAGS: -mod=readonly
      - run: go vet ./cmd/managed-bootstrap
      - run: docker pull "$POSTGRES_TEST_IMAGE"
      - run: python3 scripts/qualify-controlplane.py
