name: GoReleaser

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to rebuild and publish
        required: true
        type: string

# Releases share the runtime tag read from runtime-image.json, so two of them
# publishing at once can each see the other's digest on it. They queue rather
# than cancel: cancelling would abandon a half-published release.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  runtime-library:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: libs/go/go.mod
          cache: false
      - name: Qualify standalone runtime library
        run: python3 scripts/qualify-runtime-library.py

  image:
    if: github.event_name == 'push'
    needs: runtime-library
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    # The publish step waits on registry propagation, so bound the job rather
    # than leave a hung read to GitHub's six-hour default.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
        with:
          driver-opts: image=moby/buildkit@sha256:2f5adac4ecd194d9f8c10b7b5d7bceb5186853db1b26e5abd3a657af0b7e26ec

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish release image tags
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          name=$(jq -er '.name' runtime-image.json)
          tag=$(jq -er '.tag' runtime-image.json)
          EXPECTED_DIGEST=$(jq -er '.digest' runtime-image.json)
          RUNTIME_IMAGE="$name@$EXPECTED_DIGEST"
          export EXPECTED_DIGEST RUNTIME_IMAGE
          .github/scripts/tag-runtime-image.sh "$name:$RELEASE_TAG" "$name:$tag"

  release:
    if: github.event_name == 'push' && !contains(github.ref_name, '-dev.')
    needs: image
    permissions:
      contents: read
    uses: codefly-dev/core/.github/workflows/go-service-release.yml@3a9e608b7de76b546e7893f105b01a2185cbecc3 # core v0.19.6
    with:
      # The bootstrap-image tests build linux/arm64 and refuse to run without
      # emulation registered ("CI must register emulation"). ci.yml gets it from
      # docker/setup-qemu-action; the shared release workflow has no such step,
      # so every release failed at `release / test` and goreleaser never ran (#104).
      # binfmt registration is the same thing setup-qemu-action does.
      setup-run: docker run --privileged --rm tonistiigi/binfmt --install arm64
    secrets: inherit

  # Iteration tags deliberately point off main. Build without the release PAT,
  # then upload data from a fresh runner; core's release gate stays intact.
  dev-build:
    if: github.event_name == 'push' && contains(github.ref_name, '-dev.')
    needs: image
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate dev tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-dev\.[0-9a-f]+$ ]]
          .github/scripts/release-backfill.sh validate-tag .
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1
      - name: Test
        run: go test -v ./...
      - name: Install Syft for archive SBOMs
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c
        with:
          syft-version: v1.44.0
      - name: Build dev release
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de
        with:
          version: '~> v2'
          args: release --clean --skip=publish,announce
      - name: Upload dev release
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: dev-release
          if-no-files-found: error
          retention-days: 7
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sbom.json
            dist/*_checksums.txt
            dist/CHANGELOG.md

  dev-publish:
    if: github.event_name == 'push' && contains(github.ref_name, '-dev.')
    needs: dev-build
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # No source checkout, hooks, or executables from the build job. The token
      # is repository-scoped and only passed to the upload step, never GH_PAT.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: dev-release
          path: dist
      - name: Publish dev prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-dev\.[0-9a-f]+$ ]]
          prefix="dist/service-postgres_${RELEASE_TAG#v}"
          assets=("${prefix}_checksums.txt")
          for platform in darwin_amd64 darwin_arm64 linux_amd64; do
            assets+=("${prefix}_${platform}.tar.gz" "${prefix}_${platform}.tar.gz.sbom.json")
          done
          for asset in "${assets[@]}" dist/CHANGELOG.md; do
            if [[ ! -s "$asset" ]]; then
              echo "::error::missing or empty dev release file: $asset" >&2
              exit 1
            fi
          done
          gh release create "$RELEASE_TAG" "${assets[@]}" \
            --verify-tag --prerelease --latest=false \
            --title "$RELEASE_TAG" --notes-file dist/CHANGELOG.md

  backfill:
    if: github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Check out release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag }}
          path: release-source
      - name: Validate tag
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: .github/scripts/release-backfill.sh validate-tag release-source
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: release-source/go.mod
          cache-dependency-path: release-source/go.sum
      - name: Repair dependency metadata
        run: |
          cp release-source/go.mod "${{ runner.temp }}/release.mod"
          cp release-source/go.sum "${{ runner.temp }}/release.sum"
          cd release-source
          go mod tidy -modfile="${{ runner.temp }}/release.mod"
      - name: Test
        run: go test -v ./...
        working-directory: release-source
        env:
          GOFLAGS: -modfile=${{ runner.temp }}/release.mod
      - name: Qualify standalone runtime library when present in release source
        if: hashFiles('release-source/libs/go/go.mod') != ''
        run: python3 scripts/qualify-runtime-library.py --source-root release-source
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de
        with:
          version: '~> v2'
          args: release --clean --skip=publish,announce
          workdir: release-source
        env:
          GOFLAGS: -modfile=${{ runner.temp }}/release.mod
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: .github/scripts/release-backfill.sh publish release-source/dist
