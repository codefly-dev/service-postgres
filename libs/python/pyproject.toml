[project]
name = "codefly-postgres"
version = "0.1.0"
description = "Tenant-scoped and maintenance repository transactions for Codefly Postgres"
requires-python = ">=3.11"
dependencies = ["psycopg[pool]>=3.2,<4", "pydantic>=2.9,<3"]

[build-system]
requires = ["uv_build>=0.9,<0.14"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pytest>=8,<10", "psycopg[binary]>=3.2,<4", "pyright>=1.1,<2"]
